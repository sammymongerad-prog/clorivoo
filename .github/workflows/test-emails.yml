name: Test Email System

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE: https://vcptpgmsxwynbobsmmdd.supabase.co
      KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Fetch real buyer from DB
        id: buyer
        run: |
          RESPONSE=$(curl -s "$BASE/rest/v1/profiles?select=id,email,full_name&email=not.is.null&limit=1" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY")
          echo "data=$RESPONSE" >> $GITHUB_OUTPUT
          echo "Buyer: $RESPONSE"

      - name: Fetch real seller from DB
        id: seller
        run: |
          RESPONSE=$(curl -s "$BASE/rest/v1/profiles?select=id,email,full_name&role=eq.seller&email=not.is.null&limit=1" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY")
          echo "data=$RESPONSE" >> $GITHUB_OUTPUT
          echo "Seller: $RESPONSE"

      - name: TEST 1 - send-email direct
        run: |
          RESULT=$(curl -s -X POST "$BASE/functions/v1/send-email" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"to":"sammymongerad@gmail.com","subject":"[GitHub Actions] Test send-email direct","html":"<h1>Test direct OK</h1><p>Ce test a ete execute par GitHub Actions.</p>"}')
          echo "Result: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"

      - name: TEST 2 - on-new-order webhook
        run: |
          BUYER_ID=$(curl -s "$BASE/rest/v1/profiles?select=id&email=not.is.null&limit=1" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          echo "Using buyer_id: $BUYER_ID"
          RESULT=$(curl -s -X POST "$BASE/functions/v1/on-new-order" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d "{\"record\":{\"id\":\"test-github-actions-001\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":99.99,\"status\":\"pending\",\"shipping_address\":{\"street\":\"1 rue GitHub\",\"city\":\"Paris\",\"zip\":\"75001\",\"country\":\"France\"}}}")
          echo "Result: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"

      - name: TEST 3 - on-order-status (shipped)
        run: |
          BUYER_ID=$(curl -s "$BASE/rest/v1/profiles?select=id&email=not.is.null&limit=1" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          RESULT=$(curl -s -X POST "$BASE/functions/v1/on-order-status" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d "{\"record\":{\"id\":\"test-github-actions-001\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":99.99,\"status\":\"shipped\",\"tracking_number\":\"GH-ACTIONS-TRACK-123\"},\"old_record\":{\"id\":\"test-github-actions-001\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":99.99,\"status\":\"pending\",\"tracking_number\":null}}")
          echo "Result: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"

      - name: TEST 4 - on-kyc-update (approved)
        run: |
          KYC=$(curl -s "$BASE/rest/v1/kyc_requests?select=id,seller_id,status&limit=1" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY")
          KYC_ID=$(echo $KYC | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if d else '')")
          SELLER_ID=$(echo $KYC | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['seller_id'] if d else '')")
          if [ -z "$KYC_ID" ]; then
            echo "SKIP: aucun kyc_request en DB"
          else
            RESULT=$(curl -s -X POST "$BASE/functions/v1/on-kyc-update" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d "{\"record\":{\"id\":\"$KYC_ID\",\"seller_id\":\"$SELLER_ID\",\"status\":\"approved\",\"review_notes\":null},\"old_record\":{\"id\":\"$KYC_ID\",\"seller_id\":\"$SELLER_ID\",\"status\":\"pending\",\"review_notes\":null}}")
            echo "Result: $RESULT"
            echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"
          fi

      - name: Resultat final
        run: |
          echo "========================================"
          echo "Tests termines - verifie sammymongerad@gmail.com"
          echo "========================================"
