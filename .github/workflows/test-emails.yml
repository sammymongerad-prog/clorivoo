name: Test Email System

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE: https://vcptpgmsxwynbobsmmdd.supabase.co
      KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ORDER_ID: aaaabbbb-cccc-dddd-eeee-ffff00009999

    steps:
      - name: TEST DIRECT - send-email fonctionne
        run: |
          RESULT=$(curl -s -X POST "$BASE/functions/v1/send-email" \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"to":"d32071267@gmail.com","subject":"[DEBUG] Test direct send-email","html":"<h1>Debug OK</h1><p>send-email fonctionne directement.</p>"}')
          echo "Direct send-email response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES send-email direct" || echo "ECHEC send-email direct: $RESULT"

      - name: Fetch IDs from DB
        id: ids
        run: |
          BUYER=$(curl -s "$BASE/rest/v1/profiles?select=id,email&email=not.is.null&limit=1" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY")
          BUYER_ID=$(echo $BUYER | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          BUYER_EMAIL=$(echo $BUYER | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['email'])")

          SELLER=$(curl -s "$BASE/rest/v1/profiles?select=id,email&role=eq.seller&email=not.is.null&limit=1" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY")
          SELLER_ID=$(echo $SELLER | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if d else '')")

          KYC=$(curl -s "$BASE/rest/v1/kyc_requests?select=id,seller_id&limit=1" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY")
          KYC_ID=$(echo $KYC | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if d else '')")
          KYC_SELLER=$(echo $KYC | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['seller_id'] if d else '')")

          echo "buyer_id=$BUYER_ID" >> $GITHUB_OUTPUT
          echo "buyer_email=$BUYER_EMAIL" >> $GITHUB_OUTPUT
          echo "seller_id=$SELLER_ID" >> $GITHUB_OUTPUT
          echo "kyc_id=$KYC_ID" >> $GITHUB_OUTPUT
          echo "kyc_seller=$KYC_SELLER" >> $GITHUB_OUTPUT
          echo "Buyer: $BUYER_ID ($BUYER_EMAIL) | Seller: $SELLER_ID | KYC: $KYC_ID"

      - name: Insert test order in DB
        run: |
          BUYER_ID="${{ steps.ids.outputs.buyer_id }}"
          SELLER_ID="${{ steps.ids.outputs.seller_id }}"

          # Delete existing test order if any
          curl -s -X DELETE "$BASE/rest/v1/order_items?order_id=eq.$ORDER_ID" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" > /dev/null
          curl -s -X DELETE "$BASE/rest/v1/orders?id=eq.$ORDER_ID" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" > /dev/null

          # Insert order
          curl -s -X POST "$BASE/rest/v1/orders" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"pending\",\"shipping_address\":{\"street\":\"42 rue du Test\",\"city\":\"Montreal\",\"zip\":\"H2X1Y5\",\"country\":\"Canada\"}}"
          echo "Order inserted"

          # Insert order item
          if [ -n "$SELLER_ID" ]; then
            curl -s -X POST "$BASE/rest/v1/order_items" \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"order_id\":\"$ORDER_ID\",\"seller_id\":\"$SELLER_ID\",\"title\":\"Produit de test\",\"unit_price\":64.99,\"quantity\":2}"
            echo "Item inserted"
          fi

      - name: EMAIL 1 - Confirmation commande (acheteur + vendeur)
        run: |
          BUYER_ID="${{ steps.ids.outputs.buyer_id }}"
          RESULT=$(curl -s -X POST "$BASE/functions/v1/on-new-order" \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"pending\",\"shipping_address\":{\"street\":\"42 rue du Test\",\"city\":\"Montreal\",\"zip\":\"H2X1Y5\",\"country\":\"Canada\"}}}")
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"

      - name: EMAIL 2 - Commande confirmee (statut confirmed)
        run: |
          BUYER_ID="${{ steps.ids.outputs.buyer_id }}"
          RESULT=$(curl -s -X POST "$BASE/functions/v1/on-order-status" \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"confirmed\",\"tracking_number\":null},\"old_record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"pending\",\"tracking_number\":null}}")
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"

      - name: EMAIL 3 - Commande en traitement (statut processing)
        run: |
          BUYER_ID="${{ steps.ids.outputs.buyer_id }}"
          RESULT=$(curl -s -X POST "$BASE/functions/v1/on-order-status" \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"processing\",\"tracking_number\":null},\"old_record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"confirmed\",\"tracking_number\":null}}")
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"

      - name: EMAIL 4 - Commande expediee avec numero de suivi
        run: |
          BUYER_ID="${{ steps.ids.outputs.buyer_id }}"
          RESULT=$(curl -s -X POST "$BASE/functions/v1/on-order-status" \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"shipped\",\"tracking_number\":\"CLORIVO-TRACK-789XYZ\"},\"old_record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"processing\",\"tracking_number\":null}}")
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"

      - name: EMAIL 5 - Commande livree
        run: |
          BUYER_ID="${{ steps.ids.outputs.buyer_id }}"
          RESULT=$(curl -s -X POST "$BASE/functions/v1/on-order-status" \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"delivered\",\"tracking_number\":\"CLORIVO-TRACK-789XYZ\"},\"old_record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"shipped\",\"tracking_number\":\"CLORIVO-TRACK-789XYZ\"}}")
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"

      - name: EMAIL 6 - Commande annulee
        run: |
          BUYER_ID="${{ steps.ids.outputs.buyer_id }}"
          RESULT=$(curl -s -X POST "$BASE/functions/v1/on-order-status" \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d "{\"record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"cancelled\",\"tracking_number\":null},\"old_record\":{\"id\":\"$ORDER_ID\",\"buyer_id\":\"$BUYER_ID\",\"total_amount\":129.99,\"status\":\"processing\",\"tracking_number\":null}}")
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"

      - name: EMAIL 7 - KYC approuve (vendeur)
        run: |
          KYC_ID="${{ steps.ids.outputs.kyc_id }}"
          KYC_SELLER="${{ steps.ids.outputs.kyc_seller }}"
          if [ -z "$KYC_ID" ]; then
            echo "SKIP: aucun kyc_request en DB"
          else
            RESULT=$(curl -s -X POST "$BASE/functions/v1/on-kyc-update" \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d "{\"record\":{\"id\":\"$KYC_ID\",\"seller_id\":\"$KYC_SELLER\",\"status\":\"approved\",\"review_notes\":null},\"old_record\":{\"id\":\"$KYC_ID\",\"seller_id\":\"$KYC_SELLER\",\"status\":\"pending\",\"review_notes\":null}}")
            echo "Response: $RESULT"
            echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"
          fi

      - name: EMAIL 8 - KYC rejete avec raison
        run: |
          KYC_ID="${{ steps.ids.outputs.kyc_id }}"
          KYC_SELLER="${{ steps.ids.outputs.kyc_seller }}"
          if [ -z "$KYC_ID" ]; then
            echo "SKIP: aucun kyc_request en DB"
          else
            RESULT=$(curl -s -X POST "$BASE/functions/v1/on-kyc-update" \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d "{\"record\":{\"id\":\"$KYC_ID\",\"seller_id\":\"$KYC_SELLER\",\"status\":\"rejected\",\"review_notes\":\"Document illisible. Veuillez soumettre une photo nette de votre piece d identite.\"},\"old_record\":{\"id\":\"$KYC_ID\",\"seller_id\":\"$KYC_SELLER\",\"status\":\"pending\",\"review_notes\":null}}")
            echo "Response: $RESULT"
            echo "$RESULT" | grep -q '"ok":true' && echo "SUCCES" || echo "ECHEC: $RESULT"
          fi

      - name: Cleanup test data
        if: always()
        run: |
          curl -s -X DELETE "$BASE/rest/v1/order_items?order_id=eq.$ORDER_ID" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" > /dev/null
          curl -s -X DELETE "$BASE/rest/v1/orders?id=eq.$ORDER_ID" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" > /dev/null
          echo "Test data cleaned up"

      - name: Resultat
        run: |
          echo "========================================"
          echo "8 emails envoyes vers d32071267@gmail.com"
          echo "========================================"
