<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Clorivo</title>
  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; }
    #error-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #fff; z-index: 99999; padding: 24px; overflow: auto;
      font-family: monospace; box-sizing: border-box;
    }
    #error-overlay h1 { color: #D14343; font-size: 18px; margin-bottom: 12px; }
    #error-overlay pre { background: #f5f5f5; padding: 12px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; color: #333; }
  </style>
  <script>
    (function() {
      var errors = [];
      function showError(msg, stack, src, line) {
        errors.push({ msg: msg, stack: stack, src: src, line: line });
        var el = document.getElementById('error-overlay');
        if (!el) { setTimeout(function() { showError(msg, stack, src, line); }, 100); return; }
        el.style.display = 'block';
        el.innerHTML = '<h1>🔴 Erreur JavaScript</h1>' +
          errors.map(function(e, i) {
            return '<p><strong>ERREUR ' + (i+1) + ':</strong></p>' +
              '<pre>' + (e.msg || '') + (e.src ? '\n\nSource: ' + e.src + ':' + e.line : '') + (e.stack ? '\n\nStack:\n' + e.stack : '') + '</pre>';
          }).join('');
      }
      window.onerror = function(msg, src, line, col, err) {
        showError(String(msg), err && err.stack, src, line);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason;
        showError(
          reason ? String(reason) : 'Unhandled Promise Rejection',
          reason && reason.stack,
          null, null
        );
      });
    })();
  </script>
</head>
<body>
  <div id="error-overlay"></div>
  <div id="root"></div>
</body>
</html>
