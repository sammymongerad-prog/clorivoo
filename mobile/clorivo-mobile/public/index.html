<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Clorivo</title>
  <style id="expo-reset">
    html, body { height: 100%; }
    body { overflow: hidden; margin: 0; padding: 0; }
    #root { display: flex; height: 100%; flex: 1; }
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #FAFAFA; display: flex; align-items: center; justify-content: center;
      z-index: 88888; flex-direction: column; gap: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    @keyframes fill {
      from { width: 0% }
      to   { width: 100% }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3 }
      50%       { opacity: 1 }
    }
    .bar-track {
      width: 160px; height: 3px; border-radius: 99px;
      background: #E8E8EE; overflow: hidden; margin-top: 56px; margin-bottom: 24px;
    }
    .bar-fill {
      height: 100%; border-radius: 99px; background: #6C4DFF;
      animation: fill 2.8s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .dots { display: flex; gap: 8px; }
    .dot {
      width: 6px; height: 6px; border-radius: 99px; background: #6C4DFF;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.22s; }
    .dot:nth-child(3) { animation-delay: 0.44s; }
    #error-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #fff; z-index: 99999; padding: 24px; overflow: auto;
      font-family: monospace; box-sizing: border-box;
    }
    #error-overlay h1 { color: #D14343; font-size: 18px; margin-bottom: 12px; }
    #error-overlay pre { background: #f5f5f5; padding: 12px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; color: #333; max-height: 300px; overflow: auto; }
  </style>
  <script>
    (function() {
      var errors = [];
      function showError(msg, stack, src, line) {
        errors.push({ msg: msg, stack: stack, src: src, line: line });
        var loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';
        var el = document.getElementById('error-overlay');
        if (!el) { setTimeout(function() { showError(msg, stack, src, line); }, 200); return; }
        el.style.display = 'block';
        var safe = function(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
        el.innerHTML = '<h1>&#128308; Erreur — copiez ce texte</h1>' +
          errors.map(function(e,i) {
            return '<p><b>ERREUR '+(i+1)+':</b></p><pre>'+
              safe(e.msg)+
              (e.src?'\n\nSource: '+safe(e.src)+':'+e.line:'')+
              (e.stack?'\n\nStack:\n'+safe(e.stack):'')+
              '</pre>';
          }).join('');
      }
      window.onerror = function(msg, src, line, col, err) {
        showError(String(msg), err && err.stack, src, line);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        showError(r ? String(r) : 'Unhandled Promise Rejection', r && r.stack, null, null);
      });
      // Intercept Metro's ErrorUtils.reportFatalError (not caught by window.onerror)
      var _euValue = null;
      Object.defineProperty(window, 'ErrorUtils', {
        configurable: true,
        get: function() { return _euValue; },
        set: function(val) {
          _euValue = val;
          if (val && typeof val.reportFatalError === 'function') {
            var orig = val.reportFatalError.bind(val);
            val.reportFatalError = function(err) {
              showError(String(err), err && err.stack, null, null);
              orig(err);
            };
          }
        }
      });
    })();
  </script>
</head>
<body>
  <div id="error-overlay"></div>
  <div id="loading">
    <div style="font-size:42px;font-weight:800;color:#0E0B1F;letter-spacing:-2px">clorivo</div>
    <div style="font-size:11px;color:#9E9EA8;letter-spacing:4px;text-transform:uppercase;margin-top:8px">shop · sell · ship</div>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <div id="root"></div>
</body>
</html>
